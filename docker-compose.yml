services:
  asterisk:
    build: ./asterisk
    container_name: pbx_asterisk
    restart: unless-stopped
    # Host-Networking: Asterisk bindet direkt die LAN-IP des Hosts, damit LAN-Gegenstellen
    # (FRITZ!Box, Tischtelefone) eine erreichbare Contact-/SDP-Adresse sehen. Im Bridge-Modus
    # traegt Asterisk die Container-interne 172.x-IP ein -> LAN-Geraete koennen keine
    # Folgepakete/Medien zustellen und die Registrierung bricht nach kurzer Zeit ab.
    # SIP: Host-Port 5060 (UDP/TCP), RTP: 10000-10100/udp, AMI: 5038 (nur intern erreichbar,
    # siehe manager.conf-ACL). Das SIP_PORT-Remapping entfaellt im Host-Modus.
    network_mode: host
    volumes:
      - ./asterisk/config:/etc/asterisk/custom
      - ./asterisk/logs:/var/log/asterisk
      - asterisk_voicemail:/var/spool/asterisk/voicemail
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        cp /etc/asterisk/custom/*.conf /etc/asterisk/ 2>/dev/null || true;
        /usr/sbin/asterisk -f
      "

  backend:
    build: ./backend
    container_name: pbx_backend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://asterisk:${DB_PASSWORD}@postgres:5432/asterisk_gui
      # Asterisk laeuft im Host-Netz -> AMI ueber das Host-Gateway erreichen (siehe extra_hosts).
      - ASTERISK_HOST=${ASTERISK_HOST:-host.docker.internal}
      - ASTERISK_PORT=5038
      - ASTERISK_USER=admin
      - ASTERISK_PASSWORD=${AMI_PASSWORD}
      - HA_API_KEY=${HA_API_KEY:-}
      - MQTT_BROKER=${MQTT_BROKER:-}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    volumes:
      - ./asterisk/config:/etc/asterisk/custom
      - ./backend:/app
      - user_uploads:/app/uploads
      - asterisk_voicemail:/var/spool/asterisk/voicemail
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_DIR:-.}:/project
      - /var/lib/fail2ban:/var/lib/fail2ban:ro
      - /var/run/fail2ban/fail2ban.sock:/var/run/fail2ban/fail2ban.sock
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    extra_hosts:
      # Zugriff aufs Host-Netz: Asterisk-AMI (5038) laeuft dort (network_mode: host).
      - "host.docker.internal:host-gateway"
    networks:
      - pbx_network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_UI_LANG=${UI_LANG:-de}
        - VITE_DEMO_HINT=${DEMO_HINT:-}
    container_name: pbx_frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:80"
    depends_on:
      - backend
    networks:
      - pbx_network

  postgres:
    image: postgres:15-alpine
    container_name: pbx_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=asterisk
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=asterisk_gui
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL nur intern erreichbar, kein Port-Mapping nötig
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterisk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pbx_network

volumes:
  postgres_data:
  asterisk_voicemail:
  user_uploads:

networks:
  pbx_network:
    driver: bridge
